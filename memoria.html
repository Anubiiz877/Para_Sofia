<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Juego memoria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #ffe0ec 0%, #ffc1dc 55%, #ff9fc7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 30px;
            position: relative;
        }
        .header { text-align: center; margin: 10px 0 18px; }
        .header h1 { font-size: 2.6em; color: #ad1457; text-shadow: 2px 2px 0 #fff; }
        .header p { margin-top: 10px; font-size: 1.2em; color: #880e4f; }
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-weight: bold;
            color: #ad1457;
            font-size: 1.05em;
            margin-bottom: 20px;
        }
        .stats span { color: #e91e63; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: min(430px, 94vw);
        }
        .card { height: 100px; perspective: 800px; cursor: pointer; }
        .card .inner {
            position: relative;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.45s;
        }
        .card.flipped .inner { transform: rotateY(180deg); }
        .card .face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3em;
            border-radius: 16px;
            backface-visibility: hidden;
            box-shadow: 0 8px 20px rgba(173, 20, 87, 0.18);
        }
        .card .front {
            background: linear-gradient(135deg, #ff8fab, #ff5c8a);
            color: #fff;
        }
        .card .back { background: #ffffff; transform: rotateY(180deg); }
        .card.matched { opacity: 0.6; }
        .card.matched .inner { animation: match-pop 0.6s ease-out; }
        @keyframes match-pop {
            0% { transform: rotateY(180deg) scale(1); }
            40% { transform: rotateY(180deg) scale(1.25); }
            100% { transform: rotateY(180deg) scale(1); }
        }
        @keyframes spawn {
            from { opacity: 0; transform: scale(0.4); }
            to { opacity: 1; transform: scale(1); }
        }
        .back {
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.9);
            color: #ad1457;
            border: 1px solid rgba(173, 20, 87, 0.3);
            padding: 13px 30px;
            font-size: 1em;
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }
        .back:hover { background: #fff; transform: translateY(-2px); }
        .win {
            position: fixed;
            inset: 0;
            background: rgba(60, 10, 40, 0.68);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            animation: fadeIn 0.4s ease-out;
        }
        .win.hidden { display: none; }
        .win .box {
            background: #fff;
            border-radius: 26px;
            padding: 34px 44px;
            text-align: center;
            color: #ad1457;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .win .box h2 { font-size: 2em; }
        .win .box p { margin: 12px 0 6px; font-size: 1.2em; }
        .win .box button {
            margin-top: 16px;
            background: linear-gradient(135deg, #ff8fab, #e91e63);
            color: #fff;
            border: none;
            padding: 12px 26px;
            font-size: 1em;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: transform 0.2s;
        }
        .win .box button:hover { transform: scale(1.06); }
        @keyframes pop-in { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .confetti-p {
            position: fixed;
            width: 12px; height: 12px;
            z-index: 25;
            pointer-events: none;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0.4; }
        }
        .kitty-guest {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 96px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
            animation: kitty-float 3.2s ease-in-out infinite;
        }
        @keyframes kitty-float {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-9px) rotate(4deg); }
        }
    </style>
</head>
<body>
    <img src="images/hello-kitty-hola.png" alt="Hello Kitty saludando" class="kitty-guest">
    <header class="header">
        <h1>🧩 Juego memoria</h1>
        <p>Encuentra las parejas de Hello Kitty 🌸</p>
    </header>

    <div class="stats">
        <span>Parejas: <span id="pairs-count">0</span>/6</span>
        <span>Intentos: <span id="moves-count">0</span></span>
    </div>

    <div id="board" class="board"></div>

    <a class="back" href="index.html?vista=carta">⬅ Volver a la sorpresa</a>

    <div id="win-overlay" class="win hidden">
        <div class="box">
            <h2>🎉 ¡Ganaste, Sofia!</h2>
            <p>eres súper rápida para encontrar las parejas 💖</p>
            <p id="win-moves"></p>
            <button id="replay-btn">🔄 Jugar otra vez</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const board = document.getElementById('board');
            const pairsEl = document.getElementById('pairs-count');
            const movesEl = document.getElementById('moves-count');
            const winOverlay = document.getElementById('win-overlay');
            const replayBtn = document.getElementById('replay-btn');

            const BASE = ['🌸', '💖', '🍰', '🌈', '🦋', '🎀'];

            function shuffle(a) {
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    const t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }

            function startGame() {
                board.innerHTML = '';
                pairsEl.textContent = '0';
                movesEl.textContent = '0';
                winOverlay.classList.add('hidden');

                let flipped = [];
                let matched = 0;
                let moves = 0;
                let lock = false;

                const deck = shuffle(BASE.concat(BASE));
                deck.forEach(function(emo, i) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animation = 'spawn 0.4s ease-out both';
                    card.style.animationDelay = (i * 60) + 'ms';
                    card.innerHTML = '<div class="inner">' +
                        '<div class="face front">❓</div>' +
                        '<div class="face back">' + emo + '</div>' +
                        '</div>';
                    card.addEventListener('click', function() {
                        if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
                        card.classList.add('flipped');
                        flipped.push({ card: card, emo: emo });
                        if (flipped.length === 2) {
                            lock = true;
                            moves++;
                            movesEl.textContent = moves;
                            const a = flipped[0];
                            const b = flipped[1];
                            if (a.emo === b.emo) {
                                matched++;
                                pairsEl.textContent = matched;
                                a.card.classList.add('matched');
                                b.card.classList.add('matched');
                                flipped = [];
                                lock = false;
                                if (matched === 6) {
                                    setTimeout(function() { showWin(moves); }, 550);
                                }
                            } else {
                                setTimeout(function() {
                                    a.card.classList.remove('flipped');
                                    b.card.classList.remove('flipped');
                                    flipped = [];
                                    lock = false;
                                }, 850);
                            }
                        }
                    });
                    board.appendChild(card);
                });
            }

            function showWin(moves) {
                document.getElementById('win-moves').textContent =
                    'Terminó en ' + moves + ' intentos. ¡Impresionante! 🌟';
                winOverlay.classList.remove('hidden');
                confetti();
            }

            function confetti() {
                const colors = ['#ff5c8a', '#ffd54f', '#7c4dff', '#64dd8a', '#ff8a65', '#f06292'];
                for (let i = 0; i < 45; i++) {
                    setTimeout(function() {
                        const c = document.createElement('div');
                        c.className = 'confetti-p';
                        c.style.left = Math.random() * 100 + 'vw';
                        c.style.top = '-12px';
                        c.style.background = colors[Math.floor(Math.random() * colors.length)];
                        c.style.animationDuration = (2.4 + Math.random() * 2) + 's';
                        if (Math.random() > 0.5) c.style.borderRadius = '50%';
                        document.body.appendChild(c);
                        setTimeout(function() { c.remove(); }, 6000);
                    }, i * 50);
                }
            }

            replayBtn.addEventListener('click', startGame);
            startGame();
        });
    </script>
</body>
</html>
