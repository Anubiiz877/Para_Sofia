<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Sueños cumplidos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0b1030 0%, #1a1a4e 55%, #2a2a6e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        .header {
            text-align: center;
            padding: 14vh 20px 20px;
            color: #fff;
            z-index: 2;
        }
        .header h1 {
            font-size: 3em;
            animation: glow 2.5s ease-in-out infinite;
        }
        .header p {
            margin-top: 12px;
            font-size: 1.3em;
            color: #ffd6e8;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 15px #ffd700, 0 0 35px #ff9a3c; opacity: 1; }
            50% { text-shadow: 0 0 35px #ffd700, 0 0 70px #ff9a3c; opacity: 0.92; }
        }
        .star {
            position: fixed;
            color: #ffe9b3;
            pointer-events: auto;
            cursor: pointer;
            animation: twinkle 2s ease-in-out infinite;
            transition: transform 0.2s;
        }
        .star:hover {
            filter: brightness(1.6) drop-shadow(0 0 8px #ffd700);
        }
        .wish-float {
            position: fixed;
            font-size: 1.2em;
            color: #ffe9b3;
            background: rgba(22, 24, 66, 0.78);
            padding: 10px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 233, 179, 0.45);
            pointer-events: none;
            z-index: 6;
            text-align: center;
            box-shadow: 0 6px 26px rgba(0, 0, 0, 0.4);
            animation: wishUp 2.2s ease-out forwards;
        }
        @keyframes wishUp {
            0% { opacity: 0; transform: translate(-50%, 12px) scale(0.8); }
            12% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -90px) scale(0.95); }
        }
        @keyframes burst {
            0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .shooting {
            position: fixed;
            width: 2px; height: 2px;
            background: radial-gradient(circle, #fff, transparent);
            z-index: 1;
        }
        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
            5% { opacity: 1; }
            70% { transform: translate(-60vw, 42vh) rotate(-35deg); opacity: 0; }
            100% { transform: translate(-60vw, 42vh) rotate(-35deg); opacity: 0; }
        }
        .meteor {
            position: fixed;
            width: 130px; height: 46px;
            z-index: 2;
        }
        .meteor .rock {
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 28px;
            background: linear-gradient(150deg, #b3aa98 0%, #6e6a5e 45%, #3b3932 100%);
            clip-path: polygon(4% 22%, 30% 4%, 58% 8%, 88% 20%, 98% 52%, 86% 82%, 56% 94%, 24% 90%, 2% 60%);
            box-shadow: inset -5px -4px 0 rgba(255, 130, 40, 0.5), inset 5px 4px 0 rgba(255, 255, 255, 0.12);
        }
        .meteor .rock::before {
            content: '';
            position: absolute; inset: 5px;
            background:
                radial-gradient(circle at 32% 38%, #ffa726 0 24%, transparent 26%),
                radial-gradient(circle at 66% 68%, #ff8f00 0 20%, transparent 22%),
                radial-gradient(circle at 74% 26%, #ff7043 0 16%, transparent 18%);
        }
        .meteor .flame {
            position: absolute;
            left: 18px; top: 50%;
            transform: translateY(-50%);
            width: 112px; height: 46px;
            background:
                radial-gradient(ellipse at 20% 55%, rgba(255, 255, 190, 0.95) 0 18%, transparent 30%),
                radial-gradient(ellipse at 38% 50%, rgba(255, 205, 100, 0.9) 0 28%, transparent 44%),
                radial-gradient(ellipse at 60% 50%, rgba(255, 140, 40, 0.75) 0 36%, transparent 55%),
                radial-gradient(ellipse at 85% 50%, rgba(255, 90, 20, 0.5) 0 24%, transparent 38%);
            animation: flame-flicker 0.4s ease-in-out infinite;
        }
        @keyframes flame-flicker {
            0%, 100% { transform: translateY(-50%) scaleY(1); opacity: 1; }
            50% { transform: translateY(-50%) scaleY(1.15); opacity: 0.88; }
        }
        .meteor .spark {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #ffd54f;
            box-shadow: 0 0 6px 2px rgba(255, 152, 0, 0.8);
            animation: spark-drift 0.55s ease-out infinite;
        }
        @keyframes spark-drift {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(16px, -10px) scale(0.4); }
        }
        @keyframes meteor-path {
            0% { transform: translate(0, 0); opacity: 0; }
            4% { opacity: 1; }
            60% { transform: translate(-62vw, 36vh); opacity: 1; }
            75%, 100% { transform: translate(-62vw, 36vh); opacity: 0; }
        }
        .fugaz {
            position: fixed;
            width: 230px; height: 30px;
            z-index: 3;
        }
        .fugaz .head {
            position: absolute;
            left: 6px; top: 50%;
            transform: translateY(-50%);
            width: 26px; height: 26px;
            background: linear-gradient(160deg, #ffffff 0%, #dce9ff 40%, #9fc0ff 100%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 10px #a9c4ff) drop-shadow(0 0 26px rgba(150, 175, 255, 0.7));
            animation: head-twinkle 1.4s ease-in-out infinite;
        }
        @keyframes head-twinkle {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.18); }
        }
        .fugaz .tail {
            position: absolute;
            left: 20px; top: 50%;
            transform: translateY(-50%);
            width: 210px; height: 16px;
            background: linear-gradient(to left, rgba(235, 242, 255, 0.95), rgba(200, 215, 255, 0.42) 50%, rgba(160, 190, 255, 0) 100%);
            clip-path: polygon(100% 50%, 74% 6%, 42% 22%, 10% 36%, 0 50%, 10% 64%, 42% 78%, 74% 94%);
            filter: drop-shadow(0 0 6px rgba(170, 195, 255, 0.55));
        }
        @keyframes fugaz {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            65% { transform: translate(-50vw, 26vh); opacity: 1; }
            100% { transform: translate(-50vw, 26vh); opacity: 0; }
        }
        .star-remnant {
            position: fixed;
            color: #eaf0ff;
            font-size: 28px;
            z-index: 3;
            text-shadow: 0 0 12px #bcd4ff, 0 0 30px rgba(188, 212, 255, 0.8);
            animation: remnant 1.1s ease-out forwards;
        }
        @keyframes remnant {
            0% { transform: scale(2.2); opacity: 0; }
            30% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .moon {
            position: fixed;
            top: 8vh; right: 10vw;
            width: 90px; height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff9e6, #ffd98a);
            box-shadow: 0 0 50px 15px rgba(255, 220, 150, 0.5);
            z-index: 1;
        }
        .back {
            margin: 40px auto 30px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 14px 32px;
            font-size: 1em;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s, transform 0.2s;
            z-index: 2;
        }
        .back:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .kitty-guest {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 96px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
            animation: kitty-float 3.2s ease-in-out infinite;
        }
        @keyframes kitty-float {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-9px) rotate(4deg); }
        }
    </style>
</head>
<body>
    <img src="images/hello-kitty-hola.png" alt="Hello Kitty saludando" class="kitty-guest">
    <div class="moon"></div>
    <header class="header">
        <h1>✨ Sueños cumplidos</h1>
        <p>Sofía, ver cómo cada uno de tus sueños cobra vida es la prueba definitiva de que la disciplina y la grandeza van de la mano. Que la vida te siga premiando con todas las metas que te propones conquistar</p>
    </header>
    <a class="back" href="index.html?vista=carta">⬅ Volver a la sorpresa</a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const stars = ['✦', '✧', '✦', '✧', '✦', '✧', '✦', '✧', '✦', '✧', '✦', '✧', '✦', '✧', '✦'];
            const wishes = [
                'Que tus sueños se cumplan ✨',
                'Brilla siempre, preciosa 🌟',
                'Te quiero muchísimo 💖',
                'Eres increíble tal y como eres 💫',
                'Que la vida te sonría 😊',
                'Esta estrella es para ti 🌠',
                'Sigue brillando, no pares 🥰'
            ];
            stars.forEach((s, i) => {
                const el = document.createElement('span');
                el.className = 'star';
                el.textContent = s;
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = Math.random() * 100 + 'vh';
                el.style.fontSize = (12 + Math.random() * 22) + 'px';
                el.style.animationDelay = (Math.random() * 2) + 's';
                el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const w = document.createElement('div');
                    w.className = 'wish-float';
                    w.textContent = wishes[Math.floor(Math.random() * wishes.length)];
                    w.style.left = (e.clientX) + 'px';
                    w.style.top = (e.clientY - 20) + 'px';
                    document.body.appendChild(w);
                    setTimeout(() => w.remove(), 2300);
                    starBurst(e.clientX, e.clientY);
                });
                document.body.appendChild(el);
            });
            function starBurst(x, y) {
                for (let i = 0; i < 6; i++) {
                    const s = document.createElement('span');
                    const ang = (Math.PI * 2 / 6) * i;
                    const dist = 35 + Math.random() * 25;
                    s.textContent = '✦';
                    s.style.position = 'fixed';
                    s.style.left = x + 'px';
                    s.style.top = y + 'px';
                    s.style.color = '#ffd700';
                    s.style.fontSize = (14 + Math.random() * 10) + 'px';
                    s.style.pointerEvents = 'none';
                    s.style.zIndex = 6;
                    s.style.animation = 'burst ' + (0.8 + Math.random() * 0.3) + 's ease-out forwards';
                    s.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
                    s.style.setProperty('--dy', (Math.sin(ang) * dist) + 'px');
                    document.body.appendChild(s);
                    setTimeout(() => s.remove(), 1200);
                }
            }
            function shootStar() {
                const s = document.createElement('div');
                s.className = 'shooting';
                s.style.top = (Math.random() * 35) + 'vh';
                s.style.left = (60 + Math.random() * 40) + 'vw';
                s.style.animation = 'shoot 3s ease-out forwards';
                s.style.boxShadow = '0 0 8px 2px #fff, 0 0 3px 1px #ffd700';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 3200);
            }
            shootStar();
            setInterval(shootStar, 4200);

            function meteor() {
                const m = document.createElement('div');
                m.className = 'meteor';
                m.style.left = (62 + Math.random() * 18) + 'vw';
                m.style.top = (12 + Math.random() * 18) + 'vh';
                m.style.animation = 'meteor-path ' + (4.5 + Math.random() * 1.5) + 's linear forwards';
                m.innerHTML = '<div class="flame"></div><div class="rock"></div>' +
                    '<div class="spark" style="left:92px;top:6px"></div>' +
                    '<div class="spark" style="left:112px;top:26px;animation-delay:0.25s"></div>';
                document.body.appendChild(m);
                setTimeout(() => m.remove(), 6200);
            }
            function fugaz() {
                const s = document.createElement('div');
                s.className = 'fugaz';
                s.style.left = (62 + Math.random() * 18) + 'vw';
                s.style.top = (18 + Math.random() * 20) + 'vh';
                s.style.animation = 'fugaz 2.8s ease-out forwards';
                s.innerHTML = '<div class="tail"></div><div class="head"></div>';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 3000);
            }
            function remnant() {
                const r = document.createElement('span');
                r.className = 'star-remnant';
                r.textContent = '✦';
                r.style.left = '20vw';
                r.style.top = '48vh';
                document.body.appendChild(r);
                setTimeout(() => r.remove(), 1200);
            }
            function meteorShow() {
                meteor();
                setTimeout(fugaz, 2200);
                setTimeout(remnant, 4400);
            }
            meteorShow();
            setInterval(meteorShow, 9000);
        });
    </script>
</body>
</html>
