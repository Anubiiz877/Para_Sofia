<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 Torta con estrella</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #ffd3e8 0%, #ffecd2 60%, #ff9a8b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .header { text-align: center; padding: 7vh 20px 3vh; z-index: 3; }
        .header h1 { font-size: 3em; color: #ad1457; text-shadow: 2px 2px 0 #fff; }
        .header p { margin-top: 12px; font-size: 1.3em; color: #880e4f; }
        .cake {
            position: relative;
            width: 340px; height: 250px;
            margin: 8vh auto 0;
            z-index: 3;
            animation: cake-in 1s ease-out;
        }
        @keyframes cake-in { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 14px;
        }
        .layer.top {
            bottom: 150px;
            width: 210px; height: 78px;
            background: linear-gradient(180deg, #fff0f5, #ffd6e5);
            border: 2px solid rgba(233, 30, 99, 0.25);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }
        .layer.top .glaze {
            position: absolute; bottom: 8px; left: 0; right: 0;
            height: 26px;
            background: repeating-linear-gradient(135deg, #ff80ab 0 14px, #fff 14px 20px);
            border-top: 3px solid #ff80ab;
        }
        .layer.mid {
            bottom: 72px;
            width: 260px; height: 82px;
            background: linear-gradient(180deg, #ffeef8, #ffc4dd);
            border: 2px solid rgba(233, 30, 99, 0.25);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }
        .layer.mid .glaze {
            position: absolute; bottom: 8px; left: 0; right: 0;
            height: 26px;
            background: repeating-linear-gradient(135deg, #f48fb1 0 14px, #fff 14px 20px);
            border-top: 3px solid #f48fb1;
        }
        .layer.base {
            bottom: 0;
            width: 320px; height: 78px;
            background: linear-gradient(180deg, #fff5f8, #f8bbd0);
            border: 2px solid rgba(233, 30, 99, 0.25);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
        }
        .layer.base .glaze {
            position: absolute; bottom: 8px; left: 0; right: 0;
            height: 26px;
            background: repeating-linear-gradient(135deg, #ec407a 0 14px, #fff 14px 20px);
            border-top: 3px solid #ec407a;
        }
        .candle {
            position: absolute;
            bottom: 228px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px; height: 46px;
            background: repeating-linear-gradient(45deg, #ffd54f 0 8px, #ff8fab 8px 16px);
            border-radius: 4px;
            z-index: 4;
        }
        .flame {
            position: absolute;
            bottom: 274px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px; height: 26px;
            background: radial-gradient(circle at 50% 75%, #fff7ae 0%, #ffca28 55%, #ff8f00 100%);
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            z-index: 5;
            animation: flicker 0.35s ease-in-out infinite;
            box-shadow: 0 0 30px 10px rgba(255, 200, 60, 0.55);
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .flame.out {
            animation: none;
            opacity: 0;
            transform: translateX(-50%) scale(0.2);
            box-shadow: none;
        }
        @keyframes flicker {
            0%, 100% { transform: translateX(-50%) scale(1) rotate(-1deg); }
            50% { transform: translateX(-50%) scale(1.18) rotate(2deg); opacity: 0.95; }
        }
        .smoke {
            position: absolute;
            left: 50%;
            bottom: 300px;
            width: 16px; height: 16px;
            margin-left: -8px;
            border-radius: 50%;
            background: rgba(180, 180, 195, 0.45);
            filter: blur(3px);
            z-index: 6;
            pointer-events: none;
            animation: smoke-rise 1.4s ease-out forwards;
        }
        @keyframes smoke-rise {
            0% { opacity: 0.9; transform: translateY(0) scale(0.6); }
            100% { opacity: 0; transform: translateY(-90px) scale(1.8); }
        }
        .toast {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #ad1457;
            padding: 12px 26px;
            border-radius: 40px;
            z-index: 60;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: toast-in 1.8s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
        }
        @keyframes toast-in {
            0% { opacity: 0; transform: translate(-50%, -12px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            82% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -8px); }
        }
        .star-wrap { position: absolute; inset: -40px; z-index: 4; animation: spin 14s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .orbiting-star {
            position: absolute;
            font-size: 1.6em;
            filter: drop-shadow(0 0 12px #ffd700);
            animation: twinkle 1.6s ease-in-out infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.5; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
        .confetti {
            position: fixed;
            z-index: 1;
            width: 10px; height: 10px;
            animation: fall 3.5s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0.4; }
        }
        .back {
            margin: 4vh auto 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #ad1457;
            border: 1px solid rgba(173, 20, 87, 0.3);
            padding: 14px 32px;
            font-size: 1em;
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            z-index: 3;
        }
        .back:hover { background: #fff; transform: translateY(-2px); }
        .kitty-guest {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 96px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
            animation: kitty-float 3.2s ease-in-out infinite;
        }
        @keyframes kitty-float {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-9px) rotate(4deg); }
        }
    </style>
</head>
<body>
    <img src="images/hello-kitty-hola.png" alt="Hello Kitty saludando" class="kitty-guest">
    <header class="header">
        <h1>🍰 Torta con estrella</h1>
        <p>Sopla la vela haciendo clic en la llama 🕯️💨</p>
    </header>
    <div class="cake">
        <div class="candle" id="candle"></div>
        <div class="flame" id="flame"></div>
        <div class="star-wrap">
            <span class="orbiting-star" style="top:-15px; left:50%;">✨</span>
            <span class="orbiting-star" style="top:50%; right:-25px;">⭐</span>
            <span class="orbiting-star" style="bottom:-15px; left:50%;">✨</span>
            <span class="orbiting-star" style="top:50%; left:-25px;">🌟</span>
        </div>
        <div class="layer top"><div class="glaze"></div></div>
        <div class="layer mid"><div class="glaze"></div></div>
        <div class="layer base"><div class="glaze"></div></div>
    </div>
    <a class="back" href="index.html?vista=carta">⬅ Volver a la sorpresa</a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const colors = ['#ffd54f', '#ff8fab', '#b39ddb', '#80deea', '#a5d6a7', '#f48fb1'];
            function dropConfetti() {
                for (let i = 0; i < 40; i++) {
                    setTimeout(() => {
                        const c = document.createElement('div');
                        c.className = 'confetti';
                        c.style.left = Math.random() * 100 + 'vw';
                        c.style.top = '-10px';
                        c.style.background = colors[Math.floor(Math.random() * colors.length)];
                        c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
                        if (Math.random() > 0.5) c.style.borderRadius = '50%';
                        document.body.appendChild(c);
                        setTimeout(() => c.remove(), 6000);
                    }, i * 60);
                }
            }
            dropConfetti();
            setInterval(dropConfetti, 5000);

            const flame = document.getElementById('flame');
            const cake = document.querySelector('.cake');
            let lit = true;

            function showToast(msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2000);
            }

            flame.addEventListener('click', function(e) {
                e.stopPropagation();
                if (lit) {
                    lit = false;
                    flame.classList.add('out');
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            const s = document.createElement('div');
                            s.className = 'smoke';
                            s.style.left = (160 + i * 10) + 'px';
                            cake.appendChild(s);
                            setTimeout(() => s.remove(), 1500);
                        }, i * 230);
                    }
                    showToast('💨 Verga chama me escupiste la cara');
                } else {
                    lit = true;
                    flame.classList.remove('out');
                    showToast('🕯️ ¡Prendida de nuevo!');
                }
            });
        });
    </script>
</body>
</html>
