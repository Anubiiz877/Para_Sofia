<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💫 Momentos mágicos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #2b1055 0%, #4a1a6b 50%, #6b2d8b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .header { text-align: center; padding: 12vh 20px 20px; color: #fff; z-index: 3; }
        .header h1 { font-size: 3em; text-shadow: 0 0 20px #ff9a3c, 0 0 50px #c86dff; }
        .header p { margin-top: 12px; font-size: 1.3em; color: #f3d9ff; }
        .magic {
            position: relative;
            width: 220px; height: 220px;
            margin: 6vh 0;
            z-index: 3;
        }
        .magic .orb {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8b8 0%, #ffd54f 35%, rgba(255, 165, 0, 0) 75%);
            box-shadow: 0 0 90px 40px rgba(255, 215, 0, 0.45);
            animation: orb-pulse 3s ease-in-out infinite;
        }
        @keyframes orb-pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.12); opacity: 1; } }
        .magic .glyph {
            position: absolute; inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5em;
            animation: spin 12s linear infinite;
            filter: drop-shadow(0 0 25px #ffd700);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ring {
            position: absolute;
            border: 3px dashed rgba(255, 215, 0, 0.55);
            border-radius: 50%;
            animation: ring-spin 8s linear infinite;
        }
        @keyframes ring-spin { to { transform: rotate(360deg); } }
        .spark {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #ffd54f;
            box-shadow: 0 0 12px 3px rgba(255, 213, 79, 0.8);
            z-index: 1;
            animation: float-up 4s ease-in-out forwards;
        }
        @keyframes float-up {
            0% { transform: translateY(20vh) scale(0.4); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-90vh) scale(1.3); opacity: 0; }
        }
        .back {
            margin: 30px auto 30px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 14px 32px;
            font-size: 1em;
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            z-index: 3;
        }
        .back:hover { background: rgba(255, 255, 255, 0.28); transform: translateY(-2px); }
        .kitty-guest {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 96px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
            animation: kitty-float 3.2s ease-in-out infinite;
        }
        @keyframes kitty-float {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-9px) rotate(4deg); }
        }
        .rocket {
            position: fixed;
            bottom: 0;
            left: var(--rx);
            width: 7px; height: 30px;
            background: linear-gradient(180deg, #fff, #ffd54f);
            border-radius: 4px;
            z-index: 40;
            opacity: 0;
            animation: wish-rocket-rise var(--rd) ease-in forwards;
        }
        @keyframes wish-rocket-rise {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(var(--rdy)); }
        }
        .boom-flash {
            position: fixed;
            left: var(--bx);
            top: var(--by);
            width: 30px; height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #ffd54f 45%, transparent 75%);
            box-shadow: 0 0 40px 18px #ffd54f;
            opacity: 0;
            z-index: 40;
            animation: wish-flash 0.6s ease-out forwards;
        }
        @keyframes wish-flash {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); }
        }
        @keyframes flash {
            0% { opacity: 0.45; }
            100% { opacity: 0; }
        }
        .sky-wish {
            position: fixed;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            font-family: 'Segoe UI', sans-serif;
            font-size: clamp(1.6em, 5vw, 2.6em);
            font-weight: bold;
            color: #fff;
            text-align: center;
            pointer-events: none;
            z-index: 45;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 16px 32px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.45), 0 10px 30px rgba(0, 0, 0, 0.45);
            text-shadow: 0 0 20px #ffd700, 0 0 50px rgba(255, 120, 200, 0.9);
            animation: sky-wish-float 5s ease-out forwards;
        }
        @keyframes sky-wish-float {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            14% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            24% { transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -70%) scale(1.02); }
        }
        .wish-btn {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 215, 0, 0.6);
            border-radius: 50px;
            padding: 12px 22px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            font-size: 1.05em;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: btn-pulse 2s infinite;
        }
        @keyframes btn-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .wish-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <img src="images/hello-kitty-hola.png" alt="Hello Kitty saludando" class="kitty-guest">
    <header class="header">
        <h1>💫 Momentos mágicos</h1>
        <p>Que cada instante de tu vida esté lleno de magia y alegría Sofi Sofi</p>
    </header>
    <div class="magic">
        <div class="orb"></div>
        <div class="ring" style="width:120%;height:120%;left:-10%;top:-10%"></div>
        <div class="ring" style="width:70%;height:70%;left:15%;top:15%;animation-direction:reverse"></div>
        <div class="glyph">💫</div>
    </div>
    <a class="back" href="index.html?vista=carta">⬅ Volver a la sorpresa</a>
    <button id="wish-btn" class="wish-btn">Apretar</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const WISH_MESSAGES = [
                'Que tus días brillen siempre Sofia',
                'Sé feliz, siempre 💖',
                'Se te quiere demasiado 💕',
                'Eres única y especial, nunca lo olvides 💫',
                'Que tus sueños dejen de ser sueños y se conviertan en metas alcanzadas 🌟',
                ' Que la magia de la vida te acompañe siempre ✨',
            ];

            function spark() {
                const s = document.createElement('div');
                s.className = 'spark';
                s.style.left = (Math.random() * 100) + 'vw';
                s.style.top = (70 + Math.random() * 30) + 'vh';
                s.style.animationDuration = (3 + Math.random() * 3) + 's';
                s.style.animationDelay = (Math.random() * 2) + 's';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 7000);
            }
            spark();
            setInterval(spark, 160);

            const wishBtn = document.getElementById('wish-btn');
            wishBtn.addEventListener('click', function() {
                if (this.disabled) return;
                this.disabled = true;
                this.style.transform = 'scale(0.92)';
                setTimeout(() => { this.style.transform = ''; }, 150);

                const x = window.innerWidth / 2;
                const targetY = window.innerHeight * 0.26;

                // Flash de pantalla al lanzar el cohete
                const screenFlash = document.createElement('div');
                screenFlash.style.position = 'fixed';
                screenFlash.style.inset = '0';
                screenFlash.style.background = 'rgba(255, 255, 255, 0.35)';
                screenFlash.style.zIndex = '60';
                screenFlash.style.pointerEvents = 'none';
                screenFlash.style.animation = 'flash 0.35s ease-out forwards';
                document.body.appendChild(screenFlash);
                setTimeout(() => screenFlash.remove(), 400);

                const rock = document.createElement('div');
                rock.className = 'rocket';
                rock.style.setProperty('--rx', (x - 3) + 'px');
                rock.style.setProperty('--rdy', (-(window.innerHeight - targetY)) + 'px');
                rock.style.setProperty('--rd', '0.95s');
                document.body.appendChild(rock);

                setTimeout(() => {
                    rock.remove();
                    const flash = document.createElement('div');
                    flash.className = 'boom-flash';
                    flash.style.setProperty('--bx', x + 'px');
                    flash.style.setProperty('--by', targetY + 'px');
                    document.body.appendChild(flash);
                    setTimeout(() => flash.remove(), 700);

                    // Burst de partículas alrededor del deseo
                    for (let i = 0; i < 14; i++) {
                        const p = document.createElement('div');
                        p.textContent = ['', '', '', ''][Math.floor(Math.random() * 4)];
                        p.style.position = 'fixed';
                        p.style.left = x + 'px';
                        p.style.top = targetY + 'px';
                        p.style.fontSize = (14 + Math.random() * 14) + 'px';
                        p.style.color = ['#ffd700', '#ffeb3b', '#fff', '#ffd6e8'][Math.floor(Math.random() * 4)];
                        p.style.zIndex = '50';
                        p.style.pointerEvents = 'none';
                        const ang = (Math.PI * 2 / 14) * i + Math.random() * 0.5;
                        const dist = 70 + Math.random() * 90;
                        p.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
                        p.style.setProperty('--dy', (Math.sin(ang) * dist) + 'px');
                        p.style.animation = 'burst 1s ease-out forwards';
                        document.body.appendChild(p);
                        setTimeout(() => p.remove(), 1000);
                    }

                    const tw = document.createElement('div');
                    tw.className = 'sky-wish';
                    tw.textContent = WISH_MESSAGES[Math.floor(Math.random() * WISH_MESSAGES.length)];
                    document.body.appendChild(tw);
                    setTimeout(() => tw.remove(), 5500);
                    wishBtn.disabled = false;
                }, 1000);
            });
        });
    </script>
</body>
</html>
